name: open-tracker-dev

services:
  postgres:
    image: postgres:18.4
    container_name: postgres
    ports:
      - '5432:5432'
    env_file:
      - .env
    # volumes:
    #   - ./scripts/create-admin.sh:/docker-entrypoint-initdb.d/create-admin.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d open-tracker']
      interval: 5s
      timeout: 5s
      retries: 5
